[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smsrio"
version = "0.2.0"
description = "User-space driver for the Siano SMS-series Rio ISDB-T tuner (187f:0600)"
authors = [{ name = "The SMSRio Open Driver Authors" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["pyusb>=1.3"]

[project.scripts]
smsrio = "smsrio.cli:main"

[tool.setuptools]
packages = ["smsrio"]
